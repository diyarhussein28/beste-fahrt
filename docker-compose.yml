services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: ops/Dockerfile.base
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "migrations.migrate"]
    restart: "no"

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    env_file: .env
    environment:
      # active_hours in config.yaml means the fleet's local working hours,
      # not UTC — without this, datetime.now() in the container defaults to
      # UTC and the window is off by 1-2 hours depending on DST.
      TZ: Europe/Berlin
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - collector_state:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  matcher:
    build:
      context: .
      dockerfile: matcher/Dockerfile
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  returns:
    build:
      context: .
      dockerfile: returns/Dockerfile
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      dockerfile: dispatcher/Dockerfile
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  ops:
    build:
      context: .
      dockerfile: ops/Dockerfile
    env_file: .env
    environment:
      # The weekly report fires Monday 08:00 local time (ops/weekly_report.py) —
      # same UTC-vs-local reasoning as the collector's active_hours.
      TZ: Europe/Berlin
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  collector_state:
